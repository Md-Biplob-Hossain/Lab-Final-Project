<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="180" cy="180" r="170" fill="#FFFFFF"/>

  <!-- small purple dashes -->
  <g stroke="#7C4DFF" stroke-width="6" stroke-linecap="round">
    <line x1="70" y1="70" x2="95" y2="95"/>
    <line x1="70" y1="95" x2="95" y2="70"/>
  </g>

  <!-- teal squiggle -->
  <path d="M280 60 C 285 80, 275 95, 280 115" fill="none" stroke="#2FC4C9" stroke-width="6" stroke-linecap="round"/>

  <!-- orange dot -->
  <circle cx="80" cy="235" r="20" fill="#FFB020"/>

  <!-- red small squiggle bottom right -->
  <path d="M255 250 C 262 258, 262 270, 255 278" fill="none" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/>

  <!-- orange stripes bottom left -->
  <g stroke="#E5772E" stroke-width="6" stroke-linecap="round">
    <line x1="90" y1="265" x2="130" y2="270"/>
    <line x1="95" y1="278" x2="135" y2="283"/>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M55 145 h55 a12 12 0 0 1 12 12 v18 a12 12 0 0 1 -12 12 h-18 l-14 14 v-14 h-23 a12 12 0 0 1 -12 -12 v-18 a12 12 0 0 1 12 -12 z" fill="#F4577E"/>
    <line x1="70" y1="166" x2="105" y2="166" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="178" x2="95" y2="178" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- big yellow question mark behind head -->
  <text x="178" y="200" font-family="Arial, sans-serif" font-size="230" font-weight="700" fill="#F6B93B" text-anchor="middle">?</text>

  <!-- small red question mark right -->
  <text x="300" y="215" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#E5484D" text-anchor="middle">?</text>

  <!-- green curly accent bottom right -->
  <path d="M300 250 C 310 258, 300 268, 310 278 C 318 285, 308 295, 316 300" fill="none" stroke="#2E9E5B" stroke-width="6" stroke-linecap="round"/>

  <!-- face -->
  <g>
    <ellipse cx="178" cy="215" rx="60" ry="58" fill="#F6CBB0"/>
    <!-- hair -->
    <path d="M120 195 C 110 140, 150 105, 178 108 C 210 105, 250 140, 238 198 C 230 175, 215 160, 200 165 C 190 150, 165 150, 156 168 C 140 160, 126 172, 120 195 Z" fill="#7C4DFF"/>
    <circle cx="140" cy="150" r="10" fill="#7C4DFF"/>
    <circle cx="216" cy="150" r="10" fill="#7C4DFF"/>
    <!-- freckles -->
    <circle cx="148" cy="228" r="3" fill="#D98E6B"/>
    <circle cx="158" cy="234" r="3" fill="#D98E6B"/>
    <circle cx="200" cy="234" r="3" fill="#D98E6B"/>
    <circle cx="210" cy="228" r="3" fill="#D98E6B"/>
    <!-- eyes closed happy -->
    <path d="M150 210 Q 158 202 166 210" fill="none" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
    <path d="M190 210 Q 198 202 206 210" fill="none" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="148" cy="222" r="9" fill="#F4A48A" opacity="0.6"/>
    <circle cx="208" cy="222" r="9" fill="#F4A48A" opacity="0.6"/>
    <!-- smile -->
    <path d="M162 235 Q 178 250 194 235" fill="none" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
