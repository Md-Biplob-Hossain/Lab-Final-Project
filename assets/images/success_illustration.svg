<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- confetti pieces -->
  <g>
    <rect x="60" y="40" width="14" height="14" rx="3" fill="#F6B93B" transform="rotate(20 67 47)"/>
    <rect x="220" y="55" width="14" height="14" rx="3" fill="#2FC4C9" transform="rotate(-15 227 62)"/>
    <circle cx="100" cy="30" r="8" fill="#E5484D"/>
    <circle cx="250" cy="95" r="8" fill="#7C4DFF"/>
    <rect x="150" y="20" width="12" height="12" rx="3" fill="#2E9E5B" transform="rotate(35 156 26)"/>
    <path d="M190 40 C 198 45, 198 55, 190 60" fill="none" stroke="#F4577E" stroke-width="6" stroke-linecap="round"/>
    <path d="M85 90 C 93 95, 93 105, 85 110" fill="none" stroke="#F6B93B" stroke-width="6" stroke-linecap="round"/>
    <rect x="35" y="110" width="12" height="12" rx="3" fill="#2FC4C9" transform="rotate(10 41 116)"/>
    <circle cx="270" cy="150" r="7" fill="#F6B93B"/>
    <rect x="255" cy="150" x="255" y="30" width="10" height="10" rx="2" fill="#E5484D" transform="rotate(45 260 35)"/>
  </g>

  <!-- party popper cone -->
  <g>
    <path d="M150 150 L 250 300 L 130 300 Z" fill="#F4A6C1"/>
    <path d="M150 150 L 250 300 L 200 300 Z" fill="#EF89AE"/>
    <ellipse cx="150" cy="150" rx="28" ry="14" fill="#F4577E"/>
    <!-- stripes on cone -->
    <g stroke="#FFFFFF" stroke-width="8" opacity="0.85">
      <line x1="150" y1="185" x2="130" y2="220"/>
      <line x1="165" y1="185" x2="150" y2="230"/>
      <line x1="180" y1="185" x2="175" y2="240"/>
      <line x1="195" y1="185" x2="205" y2="245"/>
      <line x1="210" y1="185" x2="230" y2="230"/>
    </g>
  </g>

  <!-- ribbons flying out -->
  <path d="M150 145 C 100 110, 90 70, 50 60" fill="none" stroke="#2FC4C9" stroke-width="7" stroke-linecap="round"/>
  <path d="M155 140 C 170 95, 150 60, 170 30" fill="none" stroke="#F6B93B" stroke-width="7" stroke-linecap="round"/>
  <path d="M165 145 C 210 115, 225 80, 260 65" fill="none" stroke="#2E9E5B" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 148 C 105 140, 75 145, 45 130" fill="none" stroke="#E5484D" stroke-width="7" stroke-linecap="round"/>

  <!-- stars -->
  <g fill="#F6B93B">
    <path d="M60 170 l4 10 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 z"/>
    <path d="M260 190 l3 8 8 1 -6 6 1 8 -7 -4 -7 4 1 -8 -6 -6 8 -1 z"/>
  </g>
</svg>
