<svg width="300" height="240" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- gear panel -->
  <rect x="20" y="20" width="90" height="90" rx="16" fill="#F6D888"/>
  <g transform="translate(65,65)" fill="#B8860B">
    <circle r="26" fill="none" stroke="#B8860B" stroke-width="10"/>
    <circle r="10" fill="#F6D888" stroke="#B8860B" stroke-width="6"/>
    <g>
      <rect x="-5" y="-38" width="10" height="16" rx="3"/>
      <rect x="-5" y="22" width="10" height="16" rx="3"/>
      <rect x="-38" y="-5" width="16" height="10" rx="3"/>
      <rect x="22" y="-5" width="16" height="10" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-5" y="-38" width="10" height="16" rx="3"/>
        <rect x="-5" y="22" width="10" height="16" rx="3"/>
        <rect x="-38" y="-5" width="16" height="10" rx="3"/>
        <rect x="22" y="-5" width="16" height="10" rx="3"/>
      </g>
    </g>
  </g>

  <!-- toggle panel -->
  <rect x="120" y="30" width="160" height="120" rx="16" fill="#BFE0EE"/>

  <!-- toggle switches -->
  <g>
    <rect x="145" y="55" width="110" height="30" rx="15" fill="#E5484D"/>
    <circle cx="235" cy="70" r="17" fill="#F7B8BC"/>
  </g>
  <g>
    <rect x="145" y="98" width="110" height="30" rx="15" fill="#E5484D"/>
    <circle cx="235" cy="113" r="17" fill="#F7B8BC"/>
  </g>

  <!-- hand + arm pressing toggle -->
  <g>
    <path d="M60 240 C 55 190, 70 165, 100 155 L 175 130 C 190 125, 200 130, 202 142 C 204 154, 196 162, 182 166 L 130 182" fill="#2B4C7E"/>
    <path d="M60 240 C 55 195, 68 170, 95 158 L 100 158 C 78 172, 68 195, 72 240 Z" fill="#1F3A61"/>
    <!-- sleeve stripes -->
    <g stroke="#3E63A0" stroke-width="6">
      <line x1="70" y1="210" x2="105" y2="200"/>
      <line x1="66" y1="195" x2="101" y2="185"/>
      <line x1="64" y1="180" x2="99" y2="170"/>
    </g>
    <!-- hand -->
    <ellipse cx="150" cy="172" rx="36" ry="22" fill="#8A5A34"/>
    <ellipse cx="220" cy="118" rx="14" ry="10" fill="#8A5A34" transform="rotate(-20 220 118)"/>
  </g>
</svg>
